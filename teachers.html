<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Преподаватели — Гимназия №138</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .teachers-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin: 20px;
    }
    .teacher-card {
      width: 200px;
      border: 1px solid #ccc;
      border-radius: 10px;
      overflow: hidden;
      text-align: center;
      padding: 10px;
      transition: transform 0.2s;
    }
    .teacher-card:hover {
      transform: scale(1.05);
    }
    .teacher-card img {
      width: 100%;
      height: auto;
      border-radius: 50%;
    }
    .teacher-card h4 {
      margin: 10px 0 5px 0;
    }
    .teacher-card p {
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <h1>Преподаватели гимназии №138</h1>
    <a href="index.html">← Вернуться на главную</a>
  </header>

  <main class="teachers-container">
    <div class="teacher-card">
      <img src="dir.jpeg" alt="Касымбаев Медет Иманбекович">
      <h4>Касымбаев Медет Иманбекович</h4>
      <p>Директор</p>
    </div>

    <div class="teacher-card">
      <img src="ф1.jpeg" alt="Сапаргалиева Бакытгуль" >
      <h4>Сапаргалиева Бакытгуль</h4>
      <p>Заместитель директора по учебной работе.</p>
    </div>

    <div class="teacher-card">
      <img src="ф2.jpeg" alt="Жексембаева Кенжегуль">
      <h4>Жексембаева Кенжегуль</h4>
      <p>Заместитель директора по научно-методической работе.</p>
    </div>
  </main>
</body>
</html>
